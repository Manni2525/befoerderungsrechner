# Veröffentlicht die statische Seite. Excel-Liste und BefRPolVS bleiben im Repository und gehen nicht online.
image: busybox

create-pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
